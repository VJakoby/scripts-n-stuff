### -------- Custom picom.conf config -------- ##
#glx-no-stencil = true;
#glx-no-rebind-pixmap = true;

# Using VM? => Use "xrender"
backend = "xrender";

# Using native? => Use "gxx"
# backend = "gxf";

# -- Disable visual glitches
use-damage = false;

# --- Activate vsync
vsync = "true";
shadow = "false";
unredir-if-possible = true;

# Effects
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 3;

# Set opacity for inactive windows (0.1 - 1.0)
inactive-opacity = 1.0;

# Keep active window fully opaque
active-opacity = 1.0;

# Make inactive window borders transparent
inactive-opacity-override = false;

# Force specific applications to always be transparent
opacity-rule = [
  "90:class_g = 'Alacritty' && focused",
  "75:class_g = 'Alacritty' && !focused",
  "85:class_g = 'kitty'"
];
